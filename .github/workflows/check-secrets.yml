name: Check secrets
on:
  push:
    paths: [".github/workflows/check-secrets.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG: ${{ secrets.IG_ACCESS_TOKEN }}
          PAT: ${{ secrets.GH_PAT }}
          XK: ${{ secrets.X_API_KEY }}
          XS: ${{ secrets.X_API_SECRET }}
          XT: ${{ secrets.X_ACCESS_TOKEN }}
          XA: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          s(){ [ -n "$1" ] && echo yes || echo no; }
          mkdir -p status
          {
            echo "IG_ACCESS_TOKEN: $(s "$IG")"
            if [ -n "$IG" ]; then
              code=$(curl -s -o /tmp/me.json -w "%{http_code}" "https://graph.instagram.com/v23.0/me?fields=username&access_token=$IG")
              echo "IG_TOKEN_WORKS: $code $(python3 -c "import json;print(json.load(open('/tmp/me.json')).get('username','-'))" 2>/dev/null)"
            fi
            echo "GH_PAT: $(s "$PAT")"
            echo "X_API_KEY: $(s "$XK")  X_API_SECRET: $(s "$XS")  X_ACCESS_TOKEN: $(s "$XT")  X_ACCESS_SECRET: $(s "$XA")"
            echo "checked: $(date -u)"
          } > status/secrets.txt
          git config user.name autopost-bot; git config user.email autopost-bot@users.noreply.github.com
          git add status; git commit -m "status: secrets check" && git push
