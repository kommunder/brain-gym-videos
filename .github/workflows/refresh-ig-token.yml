name: Refresh Instagram token

on:
  schedule:
    - cron: "23 3 */10 * *"     # every 10 days (token lives 60 days)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - id: r
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python autopost/refresh_ig_token.py
      - name: Store new token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "${{ steps.r.outputs.token }}"
